# Serves the compiled single-page app. The Go container serves the API, so
# this only ever handles static files and the SPA fallback.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The manifest and icons are versioned with the release, not hashed, so
    # they get a short cache instead.
    location ~* \.(webmanifest|svg|png|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # A single-page app owns its own routing, so every unknown path returns
    # index.html and lets React Router decide. Without this, a hard refresh
    # on /album/12 would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served by the Go container, not here. Returning 404 rather
    # than proxying keeps a single origin responsible for each concern.
    location /api/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Never let a proxy or the browser cache the shell itself: a stale
    # index.html would point at asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/manifest+json;

    # The app is self-contained, so everything else can be locked down.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    server_tokens off;
}
